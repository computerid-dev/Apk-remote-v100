name: Build APK

# Workflow ini build APK debug tanpa perlu Android Studio / gradlew lokal.
# Jalan otomatis kalau ada push ke branch main, atau bisa dipicu manual
# lewat tab "Actions" -> pilih workflow ini -> "Run workflow".
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # Repo ini tidak menyertakan gradlew/gradle-wrapper.jar, jadi
          # Gradle-nya di-install langsung oleh action ini.
          gradle-version: '8.9'

      - name: Build APK debug
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: RemoteBT-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
